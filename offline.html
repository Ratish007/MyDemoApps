<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08111f">
    <title>Offline | Ratish Nair</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #070708;
            --surface: #131316;
            --text: #fcfcfc;
            --muted: #aeb0b6;
            --line: #2e2e37;
            --accent: #d85040;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
        }

        article {
            width: min(560px, 100%);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 28px;
        }

        h1 {
            margin: 0 0 12px;
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        strong {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <article>
        <h1><strong>You're offline.</strong></h1>
        <p>Your Ratish Nair profile is available, but some content may require an internet connection.</p>
    </article>
</body>

</html>
